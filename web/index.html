<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Voice agent</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 40rem;
           margin: 2rem auto; padding: 0 1rem; color: #212529; }
    button { font-size: 1.1rem; padding: .6rem 1.2rem; }
    #status { font-weight: bold; margin: 1rem 0; }
    #log { font-family: ui-monospace, monospace; font-size: .9rem;
           white-space: pre-wrap; background: #f1f3f5; padding: 1rem; }
  </style>
</head>
<body>
  <h1>Talk to the agent</h1>
  <p>Press start, allow the microphone, ask a question, then wait.
     Use headphones: without them the agent can hear itself.</p>
  <button id="start">Start call</button>
  <button id="stop" disabled>Hang up</button>
  <div id="status">Not connected.</div>
  <div id="log"></div>
  <script src="https://cdn.jsdelivr.net/npm/livekit-client@2.22.3/dist/livekit-client.umd.js"></script>
  <script src="/web/app.js"></script>
</body>
</html>
