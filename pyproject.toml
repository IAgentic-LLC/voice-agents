[project]
name = "voice-agents"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1",
    "google-genai>=2.24.0",
    "livekit-agents>=1.8.2",
    "livekit-plugins-google>=1.8.2",
    "livekit-plugins-silero>=1.8.2",
    "oci>=2.187.0",
    "python-dotenv>=1.2.3",
    "uvicorn>=0.53.0",
]

[dependency-groups]
browser = [
    "playwright>=1.63.0",
]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
